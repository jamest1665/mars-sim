name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake g++-13

    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-13

    - name: Build
      run: cmake --build build --config Release -j$(nproc)

    - name: Run demos (smoke test)
      run: |
        cd build
        ./foundation_demo
        ./weather_demo
        ./terraforming_demo
        ./habitats_demo
        ./humans_demo
        ./viz_demo

    - name: Run tests
      run: cd build && ./foundation_tests && ./integration_tests || true
